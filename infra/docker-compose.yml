name: backend-fastapi

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Completa POSTGRES_APP_USER en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Completa POSTGRES_APP_PASSWORD en .env}
      POSTGRES_BREAK_GLASS_PASSWORD: ${POSTGRES_BREAK_GLASS_PASSWORD:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./postgres/permisos_break_glass.sql:/docker-entrypoint-initdb.d/20-break-glass.sql:ro
      - ./postgres/guardian_centinela.sql:/docker-entrypoint-initdb.d/30-guardian-centinela.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: backend-fastapi:local
    build:
      context: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_APP_USER}
      PGPASSWORD: ${POSTGRES_APP_PASSWORD}
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      METRICAS_ML_DIR: /data/exports
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:4b}"
      LLM_CACHE_PATH: /data/cache-f11/llm_cache.json
      BREAK_GLASS_DATABASE_URL: ${BREAK_GLASS_DATABASE_URL:-}
      BREAK_GLASS_ANALYST_KEYS_JSON: ${BREAK_GLASS_ANALYST_KEYS_JSON:-}
      AEGIS_HMAC_CLAVE: ${AEGIS_HMAC_CLAVE:-}
      PILOTO_SESIONES_JSON: ${PILOTO_SESIONES_JSON:-}
      PILOTO_ANALISTAS_JSON: ${PILOTO_ANALISTAS_JSON:-}
    volumes:
      - type: bind
        source: ${METRICAS_ML_DIR_HOST:-../data/exports}
        target: /data/exports
        read_only: true
      - cache_f11:/data/cache-f11
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  datos_postgres:
  cache_f11:
